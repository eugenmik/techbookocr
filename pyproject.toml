[project]
name = "techbookocr"
version = "0.1.0"
description = "Local OCR of scanned metallurgy/foundry books to Markdown"
requires-python = ">=3.12"
dependencies = [
  "pillow>=11.0",
  "numpy>=2.0",
  "pymupdf>=1.26",
  "openai>=1.80",
  "httpx>=0.27",
  "typer>=0.15",
  "rich>=13.9",
  "rapidfuzz>=3.10",
  "apted>=1.0.3",
  "lxml>=5.3",
  "spylls>=0.1.7",
]

[project.scripts]
techbookocr = "techbookocr.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not gpu'"
markers = [
  "gpu: needs GPU and a running docker model",
  "books: needs files in test_books/",
]
